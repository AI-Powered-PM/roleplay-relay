name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: cargo test (incl. forbidden-API guard)
        working-directory: src-tauri
        run: cargo test
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: npm audit
        run: npm audit --omit=dev
      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

  gitleaks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        shell: pwsh
        run: |
          $v = '8.30.1'
          $base = "https://github.com/gitleaks/gitleaks/releases/download/v$v"
          $zip = "gitleaks_${v}_windows_x64.zip"
          Invoke-WebRequest "$base/$zip" -OutFile $zip
          Invoke-WebRequest "$base/gitleaks_${v}_checksums.txt" -OutFile checksums.txt
          $expected = ((Select-String -Path checksums.txt -SimpleMatch $zip).Line -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "gitleaks checksum mismatch: $actual vs $expected" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\gitleaks"
          & "$env:RUNNER_TEMP\gitleaks\gitleaks.exe" git . --redact --no-banner
